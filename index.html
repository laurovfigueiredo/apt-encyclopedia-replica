<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT Encyclopedia - Replica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="logo">Cyllex <span class="muted">APT Encyclopedia</span></h1>
      <p class="sub">Replica with public data extracted from cyllex.io/encyclopedia</p>
      <nav style="margin-top:12px">
        <a href="attack.html">ATT&CK Techniques</a> · <a href="index.html">APT Groups</a> · <a href="search.html">Advanced Search</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <div class="stats-bar" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0 24px">
      <div class="card" style="padding:12px"><div class="meta">Groups Tracked</div><div style="font-size:28px;font-weight:700;margin-top:4px">58</div></div>
      <div class="card" style="padding:12px"><div class="meta">Active Threats</div><div style="font-size:28px;font-weight:700;margin-top:4px">52</div></div>
      <div class="card" style="padding:12px"><div class="meta">Total Campaigns</div><div style="font-size:28px;font-weight:700;margin-top:4px">915</div></div>
      <div class="card" style="padding:12px"><div class="meta">Intelligence Sources</div><div style="font-size:28px;font-weight:700;margin-top:4px">263+</div></div>
    </div>
    <div class="controls">
      <input type="text" id="search" placeholder="Search by name, alias, ID..." autocomplete="off">
      <div class="stats">Showing <span id="count">0</span> groups</div>
    </div>
    <div id="grid" class="grid"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
