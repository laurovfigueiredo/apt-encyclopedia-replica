<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorized Threats - Threat Model</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="logo"><a href="index.html" style="color:inherit;text-decoration:none">←</a> Cyllex <span class="muted">Categorized Threats</span></h1>
      <nav style="margin-top:12px">
        <a href="threat-model.html">Threat Model</a> · <a href="threat-categorized.html">Categorized</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <div class="card" style="margin:18px 0;padding:16px">
      <p class="tech">Choose one or multiple criteria, then see matching adversaries from the right/filtered list.</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:12px">
        <div>
          <h4>Adversary Motive</h4>
          <div id="motives" style="max-height:220px;overflow:auto;margin-top:8px"></div>
        </div>
        <div>
          <h4>Victim Industry</h4>
          <div id="industries" style="max-height:220px;overflow:auto;margin-top:8px"></div>
        </div>
        <div>
          <h4>Location (Country/Victim)</h4>
          <div id="countries" style="max-height:220px;overflow:auto;margin-top:8px"></div>
        </div>
      </div>
      <div style="margin-top:16px;display:flex;gap:8px">
        <button id="clear" style="background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer">Clear All</button>
      </div>
    </div>
    <div class="card" style="padding:16px">
      <h3>Matching Adversaries (<span id="count">0</span>)</h3>
      <div id="list" style="margin-top:12px;max-height:600px;overflow:auto"></div>
    </div>
  </main>
  <script src="threat-categorized.js?v=1"></script>
</body>
</html>
