<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Search - APT Encyclopedia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="logo"><a href="index.html" style="color:inherit;text-decoration:none">←</a> Cyllex <span class="muted">Advanced Search</span></h1>
    </div>
  </header>
  <main class="container">
    <div class="card" style="margin:18px 0 20px;padding:16px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:end">
        <div>
          <label class="meta">Search</label>
          <input type="text" id="q" placeholder="Name, alias, malware, technique..." style="width:100%;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:6px">
        </div>
        <div>
          <label class="meta">Country</label>
          <select id="country" style="width:100%;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:6px">
            <option value="">All</option>
          </select>
        </div>
        <div>
          <label class="meta">Threat Level</label>
          <select id="threat" style="width:100%;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:6px">
            <option value="">All</option>
          </select>
        </div>
        <div>
          <label class="meta">Status</label>
          <select id="status" style="width:100%;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:6px">
            <option value="">All</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
        <div>
          <button id="clear" style="background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer">Clear</button>
        </div>
      </div>
    </div>
    <div class="stats">Showing <span id="count">0</span> groups</div>
    <div id="grid" class="grid" style="margin-top:12px"></div>
  </main>
  <script src="search.js"></script>
</body>
</html>
